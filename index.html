<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cuánto</title>
    <meta
      name="description"
      content="Anota tus gastos e ingresos como en una calculadora y mira cuánto gastas y cuánto te queda cada mes, con un resumen en historias."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#19c65a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b433a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cuánto" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // Apply a saved light/dark choice before first paint to avoid a theme flash.
      try {
        var t = localStorage.getItem('mg:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta app necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
